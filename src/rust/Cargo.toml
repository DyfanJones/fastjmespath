[package]
name = 'fastjmespath'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = ['rlib', 'staticlib']
name = 'fastjmespath'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
jmespath = '0.5.0'
serde_json = '1.0'

[profile.release]
lto = true
codegen-units = 1
